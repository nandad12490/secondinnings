          const title = $('#slTitle', ov).value.trim(), tagline = $('#slTag', ov).value.trim();
          if (!setFieldErr(ov, '#slTitle', title ? '' : 'Enter a headline for this slide.')) { $('#slTitle', ov).focus(); return; }
          $('#slSave', ov).disabled = true;
          let image; try { image = await commitImage(img); } catch (e) { $('#slSave', ov).disabled = false; return; }
          if (isEdit) Object.assign(S.settings.slides[idx], { image, title, tagline });
          else S.settings.slides.push({ id: 'SLD-' + uid(), image, title, tagline });
          persist(); await gcImages(); close(); drawSlides();
          toast(isEdit ? 'Slide saved' : 'Slide added');
        };
      } });
  };
  $('#slAdd').onclick = () => openSlideForm();
  $('#slList').onclick = async e => {
    const b = e.target.closest('[data-sm]'); if (!b || b.disabled) return;
    const i = +b.dataset.i, sl = S.settings.slides;
    if (b.dataset.sm === 'edit') return openSlideForm(i);
    if (b.dataset.sm === 'del') {
      if (!(await confirmDialog({ title: `Delete slide ${i + 1}?`, danger: true, confirmText: 'Delete slide', message: `“${esc(sl[i].title)}” will be removed from the homepage slider.` }))) return;
      sl.splice(i, 1); persist(); await gcImages(); drawSlides(); toast('Slide deleted'); return;
    }
    const j = b.dataset.sm === 'up' ? i - 1 : i + 1;
    [sl[i], sl[j]] = [sl[j], sl[i]]; persist(); drawSlides(); toast('Slide order updated');
    $(`[data-sm="${b.dataset.sm}"][data-i="${j}"]`)?.focus();
  };
  drawSlides();

  /* ----- save header + contact ----- */
  $('#brForm').onsubmit = e => { e.preventDefault(); $('#brSave').click(); };
  $('#brSave').onclick = async () => {
    const root = content();
    let ok = setFieldErr(root, '#bName', $('#bName').value.trim() ? '' : 'Enter the team name.');
    const em = $('#bEmail').value.trim(), gm = cleanUrl($('#bGroundMap').value);
    ok = setFieldErr(root, '#bEmail', em && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em) ? 'Enter a valid email address, or leave it blank.' : '') && ok;
    ok = setFieldErr(root, '#bGroundMap', gm === null ? 'Enter a full web link starting with https://, or leave it blank.' : '') && ok;
    if (!ok) { root.querySelector('.field.invalid .input')?.focus(); return; }
    $('#brSave').disabled = true;
    try {
      Object.assign(S.settings, { teamName: $('#bName').value.trim(), tagline: $('#bTag').value.trim(), about: $('#bAbout').value.trim(),
        contactPhone: $('#bPhone').value.trim(), contactEmail: em, homeGround: $('#bGround').value.trim(), homeGroundMap: gm,
        footerText: $('#bFooter').value.trim(), logo: await commitImage(logo) });
    } catch (e) { $('#brSave').disabled = false; return; }
    persist(); await gcImages(); toast('Branding saved'); renderAdmin('branding');
  };
  $('#acForm').onsubmit = e => {
    e.preventDefault(); const root = $('#acForm');
    const cur = $('#aCur').value, user = $('#aUser').value.trim(), np = $('#aNew').value;
    let ok = setFieldErr(root, '#aCur', cur === S.settings.admin.password ? '' : 'Current password is incorrect.');
    ok = setFieldErr(root, '#aUser', user.length >= 3 ? '' : 'Username needs at least 3 characters.') && ok;
    ok = setFieldErr(root, '#aNew', !np || np.length >= 8 ? '' : 'Use at least 8 characters.') && ok;
    if (!ok) return;
    S.settings.admin = { username: user, password: np || S.settings.admin.password }; persist();
    const sess = Auth.current(); if (sess) { sess.user = user; sessionStorage.setItem(APP.sessionKey, JSON.stringify(sess)); }
    $('#aCur').value = ''; $('#aNew').value = ''; toast('Login details updated');
  };
}

/* ---------------------------------------------------------------------
   22. BACKUP & RESTORE
   --------------------------------------------------------------------- */
function download(name, text, mime) {
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function toCSV(rows) {
  const cell = v => { v = String(v ?? ''); if (/^[=@]/.test(v)) v = "'" + v; return /[",\n\r]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  return '\ufeff' + rows.map(r => r.map(cell).join(',')).join('\r\n');
}
function pageBackup() {
  setHead('Backup & restore', 'Download your data or restore it from a backup file.');
  const sp = S.players.filter(p => p.isSample).length, sf = S.fixtures.filter(f => f.isSample).length;
  content().innerHTML = `<div class="banner-note">${icon('info')}<span>Data is stored in this browser on this device only. Other browsers and devices won’t see it. Download a backup regularly, and use it to move your data to another device.</span></div>
  <div class="backup-grid">
    <div class="panel"><div class="panel-head"><h3>Full backup</h3></div><div class="panel-body" style="padding-top:4px;padding-bottom:4px">
      <div class="bk-item"><span class="qi">${icon('download')}</span><div><b>Download backup</b><p>Players, fixtures, squads, published line-ups, branding and every uploaded image in one JSON file. Admin login details are not included.</p><button class="btn primary sm" data-bk="export">${icon('download', 'sm')} Download backup</button></div></div>
      <div class="bk-item"><span class="qi g">${icon('upload')}</span><div><b>Restore from backup</b><p>Replaces everything in this browser with the contents of a GSI XI backup file. IDs are kept exactly as they were.</p><button class="btn sm" data-bk="import">${icon('upload', 'sm')} Choose backup file</button></div></div>
    </div></div>
    <div class="panel"><div class="panel-head"><h3>Spreadsheet exports</h3></div><div class="panel-body" style="padding-top:4px;padding-bottom:4px">
      <div class="bk-item"><span class="qi">${icon('users')}</span><div><b>Master squad CSV</b><p>${S.players.length} players with ID, styles, category, contact and status.</p><button class="btn sm" data-bk="players">${icon('file', 'sm')} Export players</button></div></div>
      <div class="bk-item"><span class="qi">${icon('calendar')}</span><div><b>Fixture list CSV</b><p>${S.fixtures.length} matches with date, day, time, category, format, venue and squad status.</p><button class="btn sm" data-bk="fixtures">${icon('file', 'sm')} Export fixtures</button></div></div>
    </div></div>
    <div class="panel"><div class="panel-head"><h3>Demo data</h3></div><div class="panel-body" style="padding-top:4px;padding-bottom:4px">
      <div class="bk-item"><span class="qi">${icon('trash')}</span><div><b>Remove sample records</b><p>${sp || sf ? `${sp} sample players and ${sf} sample fixtures are marked with a Sample tag. Your own records are not touched.` : 'No sample records left. Everything here is your own data.'}</p><button class="btn sm danger" data-bk="samples" ${sp || sf ? '' : 'disabled'}>${icon('trash', 'sm')} Remove sample data</button></div></div>
      <div class="bk-item"><span class="qi r">${icon('refresh')}</span><div><b>Reset demo data</b><p>Erases all data in this browser and loads the original GSI XI demo. Your admin login is kept.</p><button class="btn sm danger" data-bk="reset">${icon('refresh', 'sm')} Reset demo data</button></div></div>
    </div></div>
    <div class="panel"><div class="panel-head"><h3>Storage</h3></div><div class="panel-body">
      <dl class="kv"><dt>Records</dt><dd>${bytes(Store.size() * 2)} in LocalStorage</dd>
        <dt>Images</dt><dd>${ImageStore.mem.size} stored, ${bytes(ImageStore.size())}${ImageStore.ok ? ' in IndexedDB' : ' (memory only)'}</dd>
        <dt>Image storage</dt><dd>${ImageStore.ok ? '<span class="status announced">Available</span>' : '<span class="status cancelled">Unavailable in this browser</span>'}</dd>
        <dt>Last change</dt><dd>${fmtStamp(S.meta.updatedAt) || '—'}</dd></dl>
    </div></div>
  </div>`;
  content().onclick = async e => {
    const b = e.target.closest('[data-bk]'); if (!b || b.disabled) return;
    const a = b.dataset.bk;
    if (a === 'export') exportJSON();
    else if (a === 'import') importJSON();
    else if (a === 'players') {
      download(`gsi-xi-master-squad-${todayISO()}.csv`, toCSV([['Player ID', 'Name', 'Batting', 'Bowling', 'Category', 'Contact', 'Status'],
        ...S.players.map(p => [p.id, p.name, p.batting, p.bowling, p.category, p.contact, p.status])]), 'text/csv'); toast('Players exported');
    } else if (a === 'fixtures') {
      download(`gsi-xi-fixtures-${todayISO()}.csv`, toCSV([['Match ID', 'Opponent', 'Date', 'Day', 'Time', 'Category', 'Format', 'Venue', 'Map Link', 'Scoreboard Link', 'Status', 'Squad', 'Notes'],
        ...[...S.fixtures].sort(byDate).map(f => [f.id, f.opponent, f.date, weekday(f.date), f.time, f.category, f.format, f.venue, f.mapUrl || '', f.scoreUrl || '', f.status, SQ_LABEL[squadState(f.id)], f.notes])]), 'text/csv'); toast('Fixtures exported');
    } else if (a === 'samples') removeSamples();
    else if (a === 'reset') resetDemo();
  };
}
function exportJSON() {
  const data = clone(S); delete data.settings.admin;
  const payload = { app: APP.name, type: 'gsixi-backup', schema: APP.schema, exportedAt: new Date().toISOString(),
    counts: { players: S.players.length, fixtures: S.fixtures.length, images: ImageStore.mem.size }, data, images: ImageStore.all() };
  download(`gsi-xi-backup-${todayISO()}.json`, JSON.stringify(payload), 'application/json');
  toast('Backup downloaded');
}
function validateBackup(o) {
  if (!o || typeof o !== 'object') return 'The backup file is empty or unreadable.';
  if (o.type !== 'gsixi-backup' || !o.data || typeof o.data !== 'object') return 'This file is not a GSI XI backup.';
  const d = o.data;
  if (!Array.isArray(d.players) || !Array.isArray(d.fixtures)) return 'The backup is missing its players or fixtures.';
  if (d.players.some(p => !p || !p.id || !p.name)) return 'The backup has a player without an ID or name.';
  if (d.fixtures.some(f => !f || !f.id || !f.opponent || !isValidISO(f.date))) return 'The backup has a match without an ID, opponent or valid date.';
  if (new Set(d.players.map(p => p.id)).size !== d.players.length) return 'The backup has duplicate player IDs.';
  if (new Set(d.fixtures.map(f => f.id)).size !== d.fixtures.length) return 'The backup has duplicate match IDs.';
  if ((d.squads && typeof d.squads !== 'object') || (d.published && typeof d.published !== 'object')) return 'The backup’s squad data is damaged.';
  if (o.images && (typeof o.images !== 'object' || Object.values(o.images).some(v => typeof v !== 'string' || !v.startsWith('data:image')))) return 'The backup’s image data is damaged.';
  return '';
}
function importJSON() {
  const inp = Object.assign(document.createElement('input'), { type: 'file', accept: '.json,application/json' });
  inp.onchange = async () => {
    const file = inp.files[0]; if (!file) return;
    let o; try { o = JSON.parse(await file.text()); } catch (e) { toast('That file isn’t valid JSON. Choose a GSI XI backup file.', 'err'); return; }
    const err = validateBackup(o); if (err) { toast(err, 'err'); return; }
    const ok = await confirmDialog({ title: 'Restore this backup?', danger: true, confirmText: 'Replace my data',
      message: `Backup from <b>${esc(o.exportedAt ? fmtStamp(Date.parse(o.exportedAt)) : 'an unknown date')}</b> with ${o.data.players.length} players and ${o.data.fixtures.length} fixtures. Everything currently in this browser will be replaced. Your admin login is kept.` });
    if (!ok) return;
    try {
      const admin = S.settings.admin;
      const d = normalize(clone(o.data)); d.settings.admin = admin;
      const ids = new Set(d.fixtures.map(f => f.id));
      Object.keys(d.squads).forEach(k => { if (!ids.has(k)) delete d.squads[k]; });
      Object.keys(d.published).forEach(k => { if (!ids.has(k)) delete d.published[k]; });
      await ImageStore.clear();
      for (const [id, url] of Object.entries(o.images || {})) await ImageStore.put(url, id);
      S = d; persist(); SB = null;
      toast('Backup restored'); renderAdmin('backup');
    } catch (e) { console.error(e); toast('The backup could not be restored. Your browser storage may be full.', 'err'); }
  };
  inp.click();
}
async function removeSamples() {
  const sp = S.players.filter(p => p.isSample), sf = S.fixtures.filter(f => f.isSample);
  const ok = await confirmDialog({ title: 'Remove sample data?', danger: true, confirmText: 'Remove sample data',
    message: `${sp.length} sample players and ${sf.length} sample fixtures, with their squads, will be deleted. Records you created stay as they are.` });
  if (!ok) return;
  sp.forEach(p => stripPlayerFromDrafts(p.id));
  S.players = S.players.filter(p => !p.isSample);
  sf.forEach(f => { delete S.squads[f.id]; delete S.published[f.id]; });
  S.fixtures = S.fixtures.filter(f => !f.isSample);
  persist(); await gcImages(); toast('Sample data removed'); refresh();
}
async function resetDemo() {
  const ok = await confirmDialog({ title: 'Reset to demo data?', danger: true, confirmText: 'Erase and reset',
    message: 'All players, fixtures, squads, branding and images in this browser will be replaced with the demo data. Download a backup first if you want to keep them.' });
  if (!ok) return;
  const admin = S.settings.admin;
  await ImageStore.clear(); Store.clear();
  seedData(); S.settings.admin = admin; persist(); SB = null;
  toast('Demo data restored'); renderAdmin('backup');
}

/* ---------------------------------------------------------------------
   23. BOOT
   --------------------------------------------------------------------- */
async function boot() {
  await ImageStore.init();
  const stored = Store.load();
  if (stored) S = normalize(stored);          // never overwrite existing data
  else { seedData(); persist(); }              // first run only
  window.addEventListener('hashchange', route);
  // keep multiple tabs in sync
  window.addEventListener('storage', async e => {
    if (e.key !== APP.storageKey || !e.newValue || Guard.dirty) return;
    try { S = normalize(JSON.parse(e.newValue)); await ImageStore.init(); if (!$('#modal-root .overlay')) route(); } catch (err) { /* ignore */ }
  });
  route();
  const b = $('#boot'); b.style.opacity = '0'; setTimeout(() => b.remove(), 320);
  if (!ImageStore.ok) toast('Image storage is unavailable in this browser. Uploaded images will be lost on refresh.', 'warn');
  // refresh "days remaining" when the date changes while the page is open
  let day = todayISO();
  setInterval(() => { if (todayISO() !== day) { day = todayISO(); if (!location.hash.startsWith('#/admin') && !$('#modal-root .overlay')) renderPublic(); } }, 60000);
}
boot().catch(e => { console.error(e); const p = $('#boot p'); if (p) p.textContent = 'The portal could not load. Refresh the page to try again.'; });
</script>
